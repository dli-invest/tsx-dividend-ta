name: Daily TSX scan

on:
  schedule:
    # 22:00 UTC on weekdays = 17:00 ET in winter (EST) / 18:00 ET in summer (EDT),
    # i.e. always after the 16:30 ET completed-bar cutoff.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      post:
        description: "Post the report to Discord (unchecked = scan + webhook check only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: America/Toronto
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_REVIEW_WEBHOOK }}
      # Optional: if an ANTHROPIC_API_KEY secret is available the report gets an AI review.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      POST_TO_DISCORD: ${{ github.event_name == 'schedule' || inputs.post }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[ai]"

      - name: Check Discord webhook (posts nothing)
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Secret DISCORD_DAILY_REVIEW_WEBHOOK is not available to this repository. In the dli-invest org settings, give this repository access to the secret."
            exit 1
          fi
          python -m tsx_div_ta check-webhook

      # Market-data cache + last-run state (for NEW signal flags) persist between runs.
      - name: Restore data cache
        uses: actions/cache/restore@v6
        with:
          path: |
            cache
            state
          key: tsx-data-${{ github.run_id }}
          restore-keys: tsx-data-

      - name: Scan
        run: |
          args=(scan)
          if [ -n "$ANTHROPIC_API_KEY" ]; then args+=(--review); fi
          if [ "$POST_TO_DISCORD" = "true" ]; then args+=(--notify); fi
          set +e
          python -m tsx_div_ta "${args[@]}"
          code=$?
          set -e
          echo "scan exit code: $code"
          # 0 ok, 1 partial (some symbols failed) -> success; 2 fatal, 3 Discord failure -> fail
          if [ "$code" -ge 2 ]; then exit "$code"; fi

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            cache
            state
          key: tsx-data-${{ github.run_id }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tsx-report-${{ github.run_id }}
          path: |
            reports/
            logs/
          if-no-files-found: ignore
          retention-days: 30
